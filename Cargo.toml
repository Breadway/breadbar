[package]
name = "aster"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
relm4 = { version = "0.11", features = ["macros"] }
hyprland = "0.4.0-beta.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
