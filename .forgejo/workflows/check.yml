name: check

# Fast-fail lint/test on short-lived work branches, before it ever reaches
# main and triggers a dev-track release build.
on:
  push:
    branches: ['feature/**', 'fix/**']

jobs:
  check:
    runs-on: [self-hosted, hestia]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git clone --branch "${GITHUB_REF_NAME}" --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      # The local-only .cargo/config.toml [patch] redirects bread-ecosystem
      # crates to ../bread-ecosystem for fast iteration, but any `cargo build`
      # under it rewrites Cargo.lock to record them as *path* deps. Committing
      # that lock breaks `cargo build --locked` on a lone CI clone (no sibling
      # repo) — which is what stranded the shell-theme breadbar on the dev
      # track. Fail here if the committed lock isn't the clean git-tag
      # resolution, and if Cargo.toml itself ever commits the patch.
      - name: guard against a patched Cargo.lock
        run: |
          set -euo pipefail
          cd src
          if grep -qE '^\[patch\."https://git\.breadway\.dev/Breadway/bread-ecosystem"\]' Cargo.toml; then
            echo "::error::Cargo.toml commits a [patch] for bread-ecosystem — that belongs in the gitignored .cargo/config.toml only"
            exit 1
          fi
          for crate in bread-theme bread-utils bread-launcher bread-screenshots; do
            grep -q "\"$crate\"" Cargo.lock || continue
            if ! awk -v c="$crate" '
                $0 == "name = \"" c "\"" {f=1; next}
                f && /^source = "(git|registry)\+/ {ok=1; exit}
                f && /^$/ {exit}
                END {exit !ok}
              ' Cargo.lock; then
            echo "::error::Cargo.lock records $crate as a path dep (build was run with .cargo/config.toml active). Regenerate the lock without the patch and commit that."
            exit 1
            fi
          done
          echo "Cargo.lock is the clean git-tag resolution."

      - name: clippy
        run: cd src && bash ci/build.sh cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cd src && bash ci/build.sh cargo test --locked
