name: dev release

# Publishes a dev-track build on every push to `main` (the trunk
# branch; there is no separate `dev` branch). See bread-ecosystem's
# docs/release-channels.md for the release-track policy this is part of.
#
# Unlike rc-release.yml / release.yml, this build does NOT use --locked:
# every git.breadway.dev dependency (bread-theme, bread-utils,
# bread-screenshots, bread-launcher, bread-shared) is first patched to its
# own repo's `main` by bread-ecosystem's scripts/dev-deps.sh, so a
# cross-repo change lands on the dev track the moment both sides merge to
# main, with no committed pin bump needed. Cargo.toml itself keeps its
# ordinary tag pins throughout; nothing here is committed back. See
# bread-ecosystem's docs/release-channels.md ("Cross-repo dependency
# resolution") for the full model. Part of ECO-38.
on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git clone --branch main --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      # Cloned once, here, and reused both for dev-deps.sh (below) and for
      # regenerating the dev index.json at the end of this job: it used to
      # be cloned a second time just for that last step.
      - name: clone bread-ecosystem (main)
        run: |
          set -euo pipefail
          rm -rf /tmp/bread-ecosystem-ci-* 2>/dev/null || true
          # mktemp: a fixed clone path races when multiple repos' dev/beta
          # workflows run close together on the same self-hosted runner.
          ECOSYSTEM_CI_DIR="$(mktemp -d /tmp/bread-ecosystem-ci-XXXXXX)"
          git clone --branch main https://git.breadway.dev/Breadway/bread-ecosystem.git "${ECOSYSTEM_CI_DIR}"
          echo "ECOSYSTEM_CI_DIR=${ECOSYSTEM_CI_DIR}" >> "$GITHUB_ENV"

      # DEV_DEPS_DIR is pinned *inside* the checkout (src/.dev-deps), not
      # the script's own sibling-directory default: ci/build.sh's docker
      # wrapper only bind-mounts the checkout root (REPO_ROOT -> /workspace),
      # so a true sibling clone outside `src` would be invisible to the
      # containerized build step below. Keeping it inside `src` means the
      # generated .cargo/config.toml's relative paths resolve identically
      # on the host (where cargo update runs) and inside the container.
      - name: resolve dev dependencies to main
        run: |
          set -euo pipefail
          cd src
          DEV_DEPS_DIR="$(pwd)/.dev-deps" \
            bash "${ECOSYSTEM_CI_DIR}/scripts/dev-deps.sh" --root .

      - name: build
        run: cd src && bash ci/build.sh cargo build --release

      - name: compute dev version
        run: |
          set -euo pipefail
          cd src
          # Base the dev version off the latest published stable tag,
          # not Cargo.toml: Cargo.toml can go stale relative to the last
          # real release (seen in practice: breadbox/breadpad/breadcrumbs/
          # breadpaper), which would make a dev build sort as OLDER than
          # what's already installed and bakery would correctly refuse it.
          LATEST_TAG="$(git ls-remote --tags --refs \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" 'v*' \
            | awk -F/ '{print $NF}' | sed 's/^v//' | (grep -v -- '-' || true) | sort -V | tail -1)"
          if [ -n "${LATEST_TAG}" ]; then
            CUR="${LATEST_TAG}"
          else
            CUR="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          fi
          IFS='.' read -r MA MI PA <<< "${CUR}"
          SHA="$(git rev-parse --short HEAD)"
          TS="$(date -u +%Y%m%d%H%M%S)"
          echo "VERSION=${MA}.${MI}.$((PA + 1))-dev.${TS}+${SHA}" >> "$GITHUB_ENV"

      - name: prepare artifacts
        run: |
          set -euo pipefail
          PKG_DIR="/srv/breadway-dl/dev/breadbar/${VERSION}"
          mkdir -p "${PKG_DIR}"
          cp "src/target/release/breadbar" "${PKG_DIR}/breadbar-x86_64"
          strip "${PKG_DIR}/breadbar-x86_64"
          sha256sum "${PKG_DIR}/breadbar-x86_64" | awk '{print $1}' \
            > "${PKG_DIR}/breadbar-x86_64.sha256"
          cp src/LICENSE "${PKG_DIR}/"
          cp src/bakery.toml "${PKG_DIR}/bakery.toml"
          # Dependency SHA record from scripts/dev-deps.sh, so this dev
          # build is traceable back to the exact commit of each
          # git.breadway.dev dependency it was resolved against.
          cp src/dev-deps.lock.txt "${PKG_DIR}/dev-deps.lock.txt"
          ln -sfn "${VERSION}" "/srv/breadway-dl/dev/breadbar/latest"

      # No GitHub Release upload: dev, like the other non-stable track,
      # is only distributed via dl.breadway.dev/dev/.
      - name: regenerate dev index.json
        env:
          MINISIGN_SEC_KEY: ${{ secrets.BAKERY_MINISIGN_SEC_KEY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SEC_KEY:-}" ]; then
            echo "::error::BAKERY_MINISIGN_SEC_KEY_PATH secret not set; refusing to regenerate dev index.json unsigned (would leave a stale signature mismatched against fresh content and break bakery for everyone on the dev track)"
            exit 1
          fi
          TRACK=dev bash "${ECOSYSTEM_CI_DIR}/scripts/gen-index.sh"
          rm -rf "${ECOSYSTEM_CI_DIR}"
